<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#24292f"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0969da"/>
    </marker>
    <style>
      .panel { fill: #f6f8fa; stroke: #d0d7de; }
      .box { fill: #ffffff; stroke: #8c959f; }
      .hd { font-size: 11px; letter-spacing: 1.4px; fill: #57606a; font-weight: 600; }
      .t { font-size: 13px; fill: #1f2328; font-weight: 600; }
      .d { font-size: 11.5px; fill: #57606a; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .ln { stroke: #24292f; stroke-width: 1.4; fill: none; }
      .lb { font-size: 11px; fill: #24292f; }
      .bl { stroke: #0969da; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="540" fill="#ffffff"/>

  <!-- ===== Sender ===== -->
  <rect class="panel" x="24" y="24" width="320" height="400" rx="6"/>
  <text class="hd" x="44" y="50">SENDER · ALPHA-01</text>

  <rect class="box" x="44" y="66" width="280" height="54" rx="4"/>
  <text class="t" x="58" y="88">Media encoder</text>
  <text class="d" x="58" y="107">UTF-8 · Opus 6 kbps · RGB332 layers · keyframes</text>
  <path class="ln" d="M184 120 V134" marker-end="url(#a)"/>

  <rect class="box" x="44" y="136" width="280" height="54" rx="4"/>
  <text class="t" x="58" y="158">Media header</text>
  <text class="d" x="58" y="177"><tspan class="m">16 B</tspan>: kind, codec, duration, raw size, length</text>
  <path class="ln" d="M184 190 V204" marker-end="url(#a)"/>

  <rect class="box" x="44" y="206" width="280" height="54" rx="4"/>
  <text class="t" x="58" y="228">Packetizer</text>
  <text class="d" x="58" y="247">≤ 256 frames × (<tspan class="m">18 B</tspan> header + ≤ <tspan class="m">212 B</tspan> body)</text>
  <path class="ln" d="M184 260 V274" marker-end="url(#a)"/>

  <rect class="box" x="44" y="276" width="280" height="54" rx="4"/>
  <text class="t" x="58" y="298">XOR parity <tspan class="d" font-weight="400">(optional)</tspan></text>
  <text class="d" x="58" y="317">One parity frame; recovers one lost chunk</text>
  <path class="ln" d="M184 330 V344" marker-end="url(#a)"/>

  <rect class="box" x="44" y="346" width="280" height="54" rx="4" stroke="#0969da"/>
  <text class="t" x="58" y="368">Selective-repeat ARQ</text>
  <text class="d" x="58" y="387">Gaps → parity → probe, per round · ≤ 18 rounds</text>

  <!-- ===== Mesh ===== -->
  <rect class="panel" x="420" y="24" width="360" height="400" rx="6"/>
  <text class="hd" x="440" y="50">SIMULATED LoRa MESH</text>

  <!-- alternate nodes (not on route) -->
  <g stroke="#afb8c1" stroke-width="1" stroke-dasharray="3 3" fill="none">
    <path d="M466 128 L560 78"/><path d="M560 78 L646 128"/><path d="M466 128 L510 184"/><path d="M510 184 L646 128"/>
  </g>
  <g font-size="10" fill="#8c959f" text-anchor="middle">
    <circle cx="560" cy="78" r="9" fill="#ffffff" stroke="#afb8c1"/><text x="560" y="64">SOLAR-04</text>
    <circle cx="510" cy="184" r="9" fill="#ffffff" stroke="#afb8c1"/><text x="510" y="206">NOMAD-06</text>
  </g>
  <!-- active route -->
  <path d="M466 128 H740" stroke="#24292f" stroke-width="2"/>
  <g font-size="10.5" fill="#24292f" text-anchor="middle" class="m">
    <circle cx="466" cy="128" r="11" fill="#24292f"/>
    <circle cx="556" cy="128" r="11" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
    <circle cx="646" cy="128" r="11" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
    <circle cx="736" cy="128" r="11" fill="#24292f"/>
  </g>
  <g font-size="10" fill="#24292f" text-anchor="middle">
    <text x="466" y="156">ALPHA-01</text><text x="556" y="156">RELAY-02</text><text x="646" y="156">RELAY-03</text><text x="736" y="156">ECHO-05</text>
  </g>
  <g font-size="10.5" fill="#cf222e" text-anchor="middle" font-style="italic">
    <text x="511" y="120">p</text><text x="601" y="120">p</text><text x="691" y="120">p</text>
  </g>

  <line x1="440" y1="232" x2="760" y2="232" stroke="#d0d7de"/>
  <g class="d">
    <text x="440" y="258"><tspan class="t" font-size="12">Routing</tspan></text>
    <text x="440" y="276">Shortest-hop BFS, recomputed per frame, over</text>
    <text x="440" y="292">online nodes with link distance ≤ preset range.</text>
    <text x="440" y="318"><tspan class="t" font-size="12">Loss</tspan></text>
    <text x="440" y="336">Independent Bernoulli(<tspan font-style="italic">p</tspan>) per hop attempt; <tspan class="m">p = 0.20</tspan>.</text>
    <text x="440" y="362"><tspan class="t" font-size="12">Channel</tspan></text>
    <text x="440" y="380">Serialized half-duplex. Airtime ≈ bits / bitrate</text>
    <text x="440" y="396">+ PHY overhead; 250 bps – 21.9 kbps presets.</text>
  </g>

  <!-- ===== Receiver ===== -->
  <rect class="panel" x="856" y="24" width="320" height="400" rx="6"/>
  <text class="hd" x="876" y="50">RECEIVER · ECHO-05</text>

  <rect class="box" x="876" y="66" width="280" height="54" rx="4"/>
  <text class="t" x="890" y="88">Frame parser</text>
  <text class="d" x="890" y="107">Per-frame CRC-16; corrupt frames discarded</text>
  <path class="ln" d="M1016 120 V134" marker-end="url(#a)"/>

  <rect class="box" x="876" y="136" width="280" height="54" rx="4"/>
  <text class="t" x="890" y="158">Reassembly buffer</text>
  <text class="d" x="890" y="177">Holds only bytes delivered over the links</text>
  <path class="ln" d="M1016 190 V204" marker-end="url(#a)"/>

  <rect class="box" x="876" y="206" width="280" height="54" rx="4"/>
  <text class="t" x="890" y="228">XOR recovery</text>
  <text class="d" x="890" y="247">Needs parity + all other <tspan font-style="italic">n</tspan> − 1 data chunks</text>
  <path class="ln" d="M1016 260 V274" marker-end="url(#a)"/>

  <rect class="box" x="876" y="276" width="280" height="54" rx="4"/>
  <text class="t" x="890" y="298">Message verification</text>
  <text class="d" x="890" y="317">Ordered reassembly, then CRC-16 over payload</text>
  <path class="ln" d="M1016 330 V344" marker-end="url(#a)"/>

  <rect class="box" x="876" y="346" width="280" height="54" rx="4"/>
  <text class="t" x="890" y="368">Media decoder</text>
  <text class="d" x="890" y="387">Progressive pixel layers · audio after full CRC</text>

  <!-- ===== Forward path ===== -->
  <path class="ln" d="M344 128 H452" marker-end="url(#a)"/>
  <text class="lb" x="398" y="118" text-anchor="middle">frames</text>
  <path class="ln" d="M748 128 H874" marker-end="url(#a)"/>
  <text class="lb" x="814" y="118" text-anchor="middle">≤ <tspan class="m">230 B</tspan></text>

  <!-- ===== Return path ===== -->
  <path class="bl" d="M1016 424 V470 H184 V426" marker-end="url(#ab)"/>
  <rect x="402" y="458" width="396" height="24" fill="#ffffff"/>
  <text x="600" y="474" text-anchor="middle" font-size="12" fill="#0969da">Bitmap ACK over reverse route, same lossy links</text>
  <text x="600" y="508" text-anchor="middle" class="d">ACK body: verified flag (1 B) + received-chunk bitmap (⌈n/8⌉ B). Delivery is claimed only when a verified ACK reaches the sender.</text>
</svg>
